<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>You're Cute! 💖</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap");

      body {
        background: linear-gradient(45deg, #ff9a9e, #fecfef, #fecfef, #ff9a9e);
        background-size: 400% 400%;
        animation: gradientShift 4s ease infinite;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Quicksand", sans-serif;
        overflow: hidden;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .cute-container {
        text-align: center;
        position: relative;
      }

      .main-text {
        font-size: 4rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        animation: bounce 2s ease-in-out infinite;
        margin-bottom: 2rem;
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-20px);
        }
        60% {
          transform: translateY(-10px);
        }
      }

      .hearts {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .heart {
        position: absolute;
        font-size: 2rem;
        color: #ff69b4;
        animation: float 3s ease-in-out infinite;
        opacity: 0.8;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) rotate(360deg);
          opacity: 0;
        }
      }

      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        animation: sparkle 2s ease-in-out infinite;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .cute-emoji {
        font-size: 3rem;
        animation: wiggle 1s ease-in-out infinite;
        display: inline-block;
        margin: 0 10px;
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(5deg);
        }
        75% {
          transform: rotate(-5deg);
        }
      }

      @media (max-width: 768px) {
        .main-text {
          font-size: 2.5rem;
        }
        .cute-emoji {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="cute-container">
      <div class="main-text">You're Cute!</div>
    </div>

    <div class="hearts" id="hearts"></div>

    <script>
      // Create floating hearts
      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = Math.random() > 0.5 ? "💖" : "💕";
        heart.style.left = Math.random() * 100 + "%";
        heart.style.animationDelay = Math.random() * 2 + "s";
        heart.style.animationDuration = 3 + Math.random() * 2 + "s";
        document.getElementById("hearts").appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }

      // Create sparkles
      function createSparkle() {
        const sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.style.left = Math.random() * 100 + "%";
        sparkle.style.top = Math.random() * 100 + "%";
        sparkle.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(sparkle);

        setTimeout(() => {
          sparkle.remove();
        }, 2000);
      }

      // Generate hearts and sparkles
      setInterval(createHeart, 800);
      setInterval(createSparkle, 400);

      // Add click interaction
      document.addEventListener("click", function (e) {
        for (let i = 0; i < 5; i++) {
          const heart = document.createElement("div");
          heart.innerHTML = "💖";
          heart.style.position = "absolute";
          heart.style.left = e.clientX + (Math.random() - 0.5) * 100 + "px";
          heart.style.top = e.clientY + (Math.random() - 0.5) * 100 + "px";
          heart.style.fontSize = "1.5rem";
          heart.style.color = "#ff69b4";
          heart.style.pointerEvents = "none";
          heart.style.animation = "float 2s ease-out forwards";
          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 2000);
        }
      });
    </script>
  </body>
</html>
